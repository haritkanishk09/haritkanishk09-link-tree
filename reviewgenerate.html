<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #fff; font-family: 'Space Mono', monospace; padding: 20px; }
        .glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="max-w-2xl mx-auto">
    <h1 class="text-2xl font-bold mb-6 text-center">Review Code Generator</h1>
    
    <div class="glass p-6 rounded-xl space-y-4">
        <input type="text" id="imgName" placeholder="Image Filename (e.g., batman.jpg)" class="w-full p-2 bg-black rounded border border-gray-700">
        <input type="text" id="movieName" placeholder="Movie Name" class="w-full p-2 bg-black rounded border border-gray-700">
        <input type="text" id="imdbLink" placeholder="IMDb URL" class="w-full p-2 bg-black rounded border border-gray-700">
        <input type="number" id="rating" placeholder="Rating (1-5)" step="0.5" class="w-full p-2 bg-black rounded border border-gray-700">
        <textarea id="reviewText" placeholder="Your Review" class="w-full p-2 bg-black rounded border border-gray-700 h-24"></textarea>
        <button onclick="generate()" class="w-full bg-blue-600 p-2 rounded font-bold hover:bg-blue-700">Generate Code</button>
    </div>

    <div class="mt-8">
        <p class="text-sm text-gray-400 mb-2">Copy this code:</p>
        <textarea id="output" readonly class="w-full p-4 bg-gray-900 text-blue-300 rounded border border-gray-700 h-32 text-xs"></textarea>
        <button onclick="copyToClipboard()" class="mt-2 w-full bg-green-700 p-2 rounded text-sm">Copy to Clipboard</button>
    </div>

    <script>
        function generate() {
            const img = document.getElementById('imgName').value;
            const name = document.getElementById('movieName').value;
            const link = document.getElementById('imdbLink').value;
            const rate = document.getElementById('rating').value;
            const text = document.getElementById('reviewText').value;

            const code = `<div class="glass-card"><img src="images/reviews/${img}" class="poster-img"><div><h3><a href="${link}" target="_blank" style="color: #fff; text-decoration: none;">${name}</a></h3><p class="rating">${rate}</p><p>${text}</p></div></div>`;
            document.getElementById('output').value = code;
        }

        function copyToClipboard() {
            const copyText = document.getElementById("output");
            copyText.select();
            document.execCommand("copy");
        }
    </script>
</body>
</html>
